<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>IAURI MEMBER</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
background:#050505;
color:white;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
margin:0;
padding:0;
overflow-x:hidden;
}

.app-bg{
min-height:100vh;
background:
radial-gradient(circle at top right,rgba(212,175,55,.18),transparent 35%),
linear-gradient(#050505,#000);
padding:28px 20px 120px;
}

.gold{
color:#D4AF37;
}

.big-title{
font-size:64px;
font-weight:900;
line-height:1;
margin-top:18px;
}

.card{
background:
linear-gradient(145deg,
rgba(212,175,55,.14),
rgba(20,20,20,.95));
border:1px solid rgba(212,175,55,.28);
border-radius:34px;
padding:22px;
margin-bottom:24px;
box-shadow:
0 0 30px rgba(212,175,55,.08);
backdrop-filter:blur(20px);
}

.avatar{
width:112px;
height:112px;
border-radius:50%;
overflow:hidden;
border:4px solid #D4AF37;
background:#111;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.progress{
width:100%;
height:18px;
background:#000;
border-radius:999px;
overflow:hidden;
}

.progress-bar{
height:100%;
background:#D4AF37;
border-radius:999px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:92px;
background:rgba(0,0,0,.95);
border-top:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-around;
align-items:center;
z-index:999;
backdrop-filter:blur(20px);
}

.nav-item{
display:flex;
flex-direction:column;
align-items:center;
font-size:15px;
color:white;
gap:4px;
}

.rescue-btn{
width:102px;
height:102px;
border-radius:28px;
background:
radial-gradient(circle,
rgba(255,140,0,.35),
rgba(0,0,0,.95));
border:2px solid rgba(255,120,50,.7);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
margin-top:-44px;
box-shadow:
0 0 35px rgba(255,80,0,.4);
}

.qr-box img{
width:132px;
height:132px;
border-radius:18px;
background:white;
padding:8px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.grid-card{
min-height:160px;
border-radius:28px;
padding:24px;
background:
linear-gradient(145deg,
#151515,
#060606);
border:1px solid rgba(255,255,255,.08);
display:flex;
flex-direction:column;
justify-content:flex-end;
}

.grid-card.feature{
background:
linear-gradient(145deg,
rgba(212,175,55,.24),
#111);
border:1px solid rgba(212,175,55,.4);
box-shadow:
0 0 26px rgba(212,175,55,.2);
}

.reward-card{
margin-top:20px;
padding:24px;
border-radius:30px;
background:
radial-gradient(circle at top right,
rgba(255,255,150,.35),
rgba(212,175,55,.22),
#111);
border:2px solid rgba(255,235,120,.5);
box-shadow:
0 0 45px rgba(255,220,100,.3);
position:relative;
overflow:hidden;
}

.reward-card::after{
content:"REWARD";
position:absolute;
right:18px;
top:8px;
font-size:58px;
font-weight:900;
color:rgba(255,255,255,.08);
}

.service-card{
padding:22px;
border-radius:28px;
margin-bottom:18px;
background:
linear-gradient(145deg,
rgba(212,175,55,.14),
#111);
border:1px solid rgba(212,175,55,.25);
}

.date-row,.time-row{
display:flex;
gap:14px;
overflow:auto;
padding-bottom:6px;
}

.chip{
min-width:88px;
padding:18px;
border-radius:22px;
background:#18181b;
border:1px solid rgba(255,255,255,.08);
text-align:center;
}

.booking-btn{
width:100%;
height:74px;
border:none;
border-radius:999px;
background:#D4AF37;
font-size:28px;
font-weight:900;
margin-top:28px;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.modal img{
width:82vw;
max-width:420px;
border-radius:26px;
background:white;
padding:14px;
}

</style>
</head>

<body>

<div class="app-bg">

<div style="margin-top:40px;">

<div class="gold"

<div class="grid-card feature">

background:#ffe15a;
color:black;

<div style="margin-top:40px;">

<div class="bottom-nav">

</div>

<div>◉</div>

</div>

<div class="nav-item">
<div>☷</div>
<div>紀錄</div>
</div>

<div class="rescue-btn">
<div style="font-size:38px;">🔥</div>
<div style="font-size:18px;">救援</div>
</div>

</div>

<div class="modal" id="qrModal">
<img id="modalQr">

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
addDoc,
collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDO77Pw12IXXeHECJy3YSTcCV9ikok1ev8",
  authDomain: "iauri-member.firebaseapp.com",
  projectId: "iauri-member",
  storageBucket: "iauri-member.firebasestorage.app",
  messagingSenderId: "787600565952",
  appId: "1:787600565952:web:460864719a5f543844ef25",
  measurementId: "G-T8GK6SPK7K"
};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

window.db=db;
window.collection=collection;
window.addDoc=addDoc;

let currentUserId="guest";
let currentDisplayName="會員";

async function init(){

try{

await liff.init({
liffId:"2007655316-ZqoN2q6b"
});

if(liff.isLoggedIn()){

const profile=await liff.getProfile();

currentUserId=profile.userId;
currentDisplayName=profile.displayName;

document.getElementById("memberName")
.innerText=currentDisplayName;

document.getElementById("avatarImg")
.src=profile.pictureUrl;

document.getElementById("memberQr")
.src=
"https://api.qrserver.com/v1/create-qr-code/?size=132x132&data="+currentUserId;

}

}catch(e){

console.error(e);

}

}

init();

document.getElementById("memberQr")
.onclick=()=>{

document.getElementById("qrModal")
.style.display="flex";

document.getElementById("modalQr")
.src=document.getElementById("memberQr").src;

};

document.getElementById("qrModal")
.onclick=()=>{

document.getElementById("qrModal")
.style.display="none";

};

</script>
